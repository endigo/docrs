[workspace]
resolver = "3"
members = [
    "crates/docrs",
    "crates/docrs-cli",
    "crates/docrs-compat",
    "crates/docrs-wasm",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
# sha2 0.11 needs 1.88; tools/release/check.sh checks with this toolchain.
rust-version = "1.88.0"
license = "MIT"
authors = ["endigo"]
repository = "https://github.com/endigo/docrs"
keywords = ["docx", "word", "ooxml", "markdown", "document"]

[workspace.dependencies]
# The library, at the workspace version (the CLI's published dependency).
docrs = { path = "crates/docrs", version = "0.3.2" }
# Published crates take compatible updates from the versions tested here;
# Cargo.lock pins exactly what was tested,
# and `cargo install --locked` uses it.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5.2"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "=3.27.0"
proptest = "=1.12.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"
serde_bytes = "=0.11.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# The parity and property suites parse thousands of packages; unoptimized
# builds make them needlessly slow.
opt-level = 1
