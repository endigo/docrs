# Builds release artifacts for a version tag (v0.1.0) and drafts a GitHub
# release with them. Publishing to crates.io and npm stays manual
# (RELEASING.md); this workflow holds no registry tokens.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag and Cargo versions agree
        run: |
          tag=""; [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          echo "version=$(tools/release/version.sh $tag)" >> "$GITHUB_OUTPUT"
  cli:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      NAME: docrs-${{ needs.version.outputs.version }}-${{ matrix.target }}
      EXE: docrs${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p docrs-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/$EXE" LICENSE NOTICE.md CHANGELOG.md crates/docrs-cli/README.md "$NAME/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$NAME.zip" "$NAME" > /dev/null; else tar czf "$NAME.tar.gz" "$NAME"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: docrs-*.*
  npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: crates/docrs-wasm/pkg/*.tgz
  release:
    needs: [version, cli, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="## $VERSION" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          gh release create "v$VERSION" dist/* --draft --title "docrs $VERSION" --notes-file notes.md
