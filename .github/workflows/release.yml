# Publishes a version tag (v0.1.0): builds the CLI archives and the npm
# tarball, publishes docrs and docrs-cli to crates.io and the tarball to npm,
# then creates the GitHub release with the archives. Pushing the tag, or
# creating a release with a new tag on GitHub, starts it. Registry access is
# trusted publishing (OIDC) unless the CARGO_REGISTRY_TOKEN or NPM_TOKEN
# secret is set; RELEASING.md has the setup. A manual run builds only.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag and Cargo versions agree
        run: |
          tag=""; [ "$GITHUB_REF_TYPE" = tag ] && tag="$GITHUB_REF_NAME"
          echo "version=$(tools/release/version.sh $tag)" >> "$GITHUB_OUTPUT"
      - name: Nothing left open (TODO(release), npm private, undated changelog)
        if: github.ref_type == 'tag'
        run: tools/release/ready.sh "${{ steps.v.outputs.version }}"
  cli:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      NAME: docrs-${{ needs.version.outputs.version }}-${{ matrix.target }}
      EXE: docrs${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p docrs-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/$EXE" LICENSE NOTICE.md CHANGELOG.md crates/docrs-cli/README.md "$NAME/"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$NAME.zip" "$NAME" > /dev/null; else tar czf "$NAME.tar.gz" "$NAME"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: docrs-*.*
  npm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wasm-pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: crates/docrs-wasm/pkg/*.tgz
  # Each publish job skips what the registry already has, so a failed
  # release can be rerun.
  publish-crates:
    needs: [version, cli, npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        name: Trusted publishing token
        if: env.SECRET == ''
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish docrs, then docrs-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.SECRET }}
        run: |
          for crate in docrs docrs-cli; do
            if curl -sSf -o /dev/null -A "docrs release (https://github.com/endigo/docrs)" \
                "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish --locked -p "$crate"
            fi
          done
  publish-npm:
    needs: [version, cli, npm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm
      - name: Publish the tested tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          if npm view "docrs-wasm@$VERSION" version > /dev/null 2>&1; then
            echo "docrs-wasm $VERSION is already on npm"
          else
            npm publish "docrs-wasm-$VERSION.tgz" --access public --provenance
          fi
  release:
    needs: [version, publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            awk -v v="## $VERSION" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
            gh release create "$TAG" dist/* --title "docrs $VERSION" --notes-file notes.md --verify-tag
          fi
