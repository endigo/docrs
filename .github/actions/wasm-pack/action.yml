name: wasm-pack
description: Build and test the npm package (crates/docrs-wasm/pkg).
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: wasm32-unknown-unknown
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    # Built from crates.io rather than downloaded prebuilt: Cargo verifies
    # every crate's checksum, and the version follows Cargo.lock with nothing
    # else to update.
    - name: wasm-bindgen-cli at the version Cargo.lock pins
      shell: bash
      run: |
        v=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock)
        cargo install wasm-bindgen-cli --locked --version "$v"
    - shell: bash
      run: crates/docrs-wasm/build.sh --pack
    # The tests check the package's PDF with qpdf, and fail without it on CI.
    - name: Install qpdf
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y qpdf
    # The tests run on the package as npm installs it from the tarball, and
    # compile a TypeScript consumer against its typings.
    - shell: bash
      run: |
        consumer="$RUNNER_TEMP/consumer"
        mkdir -p "$consumer"
        (cd "$consumer" && npm init -y > /dev/null && npm install --ignore-scripts --no-save "$GITHUB_WORKSPACE"/crates/docrs-wasm/pkg/docrs-wasm-*.tgz typescript@5.9.3)
        DOCRS_WASM_PKG="$consumer/node_modules/docrs-wasm" DOCRS_TSC="$consumer/node_modules/.bin/tsc" \
          node --test crates/docrs-wasm/js/test.mjs
