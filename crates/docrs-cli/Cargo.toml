[package]
name = "docrs-cli"
description = "The docrs command: find, replace, review, compare and compose .docx files without disturbing the rest, and convert Markdown to Word with a template."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = ["tests/"]

[[bin]]
name = "docrs"
path = "src/main.rs"

[dependencies]
docrs = { workspace = true, features = ["markdown"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
